name: Publish family album
run-name: ${{ inputs.clock_run && format('Refresh family album · clock {0}', inputs.clock_run) || 'Publish family album' }}

on:
  workflow_dispatch:
    inputs:
      clock_run:
        description: Run ID of the hosted fallback clock, if used
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'

permissions: {}

concurrency:
  group: family-album-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.candidate.outputs.publish }}
      site_tree: ${{ steps.candidate.outputs.site_tree }}
      index_digest: ${{ steps.candidate.outputs.index_digest }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh verified families from the last published checkpoint
        run: |
          cp dist/data/current.json "$RUNNER_TEMP/previous-current.json"
          /usr/bin/python3 -c 'import requests' || {
            sudo apt-get -qq update
            sudo apt-get -qq install -y python3-requests
          }
          /usr/bin/python3 -Bu scripts/refresh_archive.py --onchain
      - name: Compare the candidate with the site actually deployed
        id: candidate
        env:
          CLOCK_RUN: ${{ inputs.clock_run }}
        run: |
          git add -- dist/data/current.json dist/current-art/
          tree=$(git write-tree)
          site_tree=$(git rev-parse "$tree:dist")
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == schedule || -n "$CLOCK_RUN" ]]; then
            deployed=$(curl --max-time 10 --max-filesize 100 -fsS 'https://squeek.machinepaystack.com/data/site-revision.txt' || true)
            if [[ "$deployed" == "$site_tree" ]] && git diff --cached --quiet; then publish=false; fi
          fi
          printf '%s\n' "$site_tree" > dist/data/site-revision.txt
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "site_tree=$site_tree" >> "$GITHUB_OUTPUT"
          echo "index_digest=$(sha256sum dist/data/current.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check archive and family trees
        if: steps.candidate.outputs.publish == 'true'
        run: node --test tests/lineage.test.mjs
      - name: Check every original and incremental update safeguards
        if: steps.candidate.outputs.publish == 'true'
        run: /usr/bin/python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Independently confirm new receipts and archive supply on Sepolia
        if: steps.candidate.outputs.publish == 'true'
        run: node scripts/verify_bundle.mjs --since "$RUNNER_TEMP/previous-current.json"
      - name: Open both collections and export the featured family cards
        if: steps.candidate.outputs.publish == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m http.server 4179 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/album-http.log" 2>&1 &
          album_server=$!
          trap 'kill "$album_server"' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:4179/
          npm run test:browser
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.candidate.outputs.publish == 'true'
        with:
          path: dist
      - name: Save only verified public index and portraits for the next update
        if: steps.candidate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$remote_head" != "$(git rev-parse HEAD)" ]]; then
            echo 'A newer main revision exists. This run will not publish its older files.'
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh verified Squeek families'
            gh auth setup-git --hostname github.com
            git push origin HEAD:refs/heads/main
          fi

  deploy:
    needs: package
    if: needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      - name: Publish the static archive
        id: site
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Read back the published index from the custom domain
        env:
          SITE_TREE: ${{ needs.package.outputs.site_tree }}
          INDEX_DIGEST: ${{ needs.package.outputs.index_digest }}
        run: |
          site=https://squeek.machinepaystack.com/data
          for attempt in {1..24}; do
            # Each probe gets a fresh edge key while GitHub switches the origin.
            query="build=$SITE_TREE&probe=$attempt"
            if revision=$(curl --max-time 12 --max-filesize 100 -fsS "$site/site-revision.txt?$query") &&
               [[ "$revision" == "$SITE_TREE" ]] &&
               curl --max-time 25 -fsS "$site/current.json?$query" -o "$RUNNER_TEMP/served-index.json" &&
               echo "$INDEX_DIGEST  $RUNNER_TEMP/served-index.json" | sha256sum --check --status; then
              echo "Public custom domain serves verified index $INDEX_DIGEST"
              exit 0
            fi
            sleep 10
          done
          echo 'The custom domain has not served the expected archive.'
          exit 1
